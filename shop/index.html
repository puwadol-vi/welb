<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bitcoin Shops Thailand</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/icon.png">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/main.css">
</head>
<body>

    <div class="hero-header">
        <div class="container text-center">
            <h1 class="fw-bold mb-1"><i class="fa-brands fa-bitcoin"></i> Bitcoin Shops</h1>
            <p class="mb-0 opacity-75 small">ร้านค้าที่รับ Bitcoin ในประเทศไทย</p>
            <div class="welb-credit">Developed by WelB</div>
        </div>
    </div>

    <div class="container" style="margin-top: -25px; position: relative; z-index: 2;">
        <div class="row g-2 mb-3">
            <div class="col-4">
                <div class="stat-box">
                    <div class="stat-number" id="totalShops">-</div>
                    <div class="stat-label">ร้านค้า</div>
                </div>
            </div>
            <div class="col-4">
                <div class="stat-box">
                    <div class="stat-number" id="totalProvinces">-</div>
                    <div class="stat-label">จังหวัด</div>
                </div>
            </div>
            <div class="col-4">
                <div class="stat-box">
                    <div class="stat-number" id="totalCats">-</div>
                    <div class="stat-label">หมวดหมู่</div>
                </div>
            </div>
        </div>

        <div id="loadingSpinner">
            <div class="spinner-border text-warning" role="status" style="width: 3rem; height: 3rem;"></div>
            <p class="mt-3 text-muted fw-bold">กำลังโหลดข้อมูลร้านค้า...</p>
        </div>

        <div id="mainContent" style="display: none;">
            <div class="view-toggler">
                <div class="btn-group">
                    <button class="btn btn-toggle active" id="btnList"><i class="fas fa-list me-1"></i> รายชื่อ</button>
                    <button class="btn btn-toggle" id="btnMap"><i class="fas fa-map-marked-alt me-1"></i> แผนที่</button>
                </div>
            </div>

            <div id="listViewSection">
                <div class="sticky-filter">
                    <div class="row g-2">
                        <div class="col-12">
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
                                <input type="text" id="searchInput" class="form-control border-start-0 ps-0" placeholder="ค้นหาร้าน, อาหาร...">
                            </div>
                        </div>
                        <div class="col-6">
                            <select id="provinceFilter" class="form-select form-select-sm">
                                <option value="">📍 ทุกจังหวัด</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <select id="categoryFilter" class="form-select form-select-sm">
                                <option value="">🏷️ หมวดหมู่</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="main-card p-0 p-md-3">
                    <table id="shopsTable" class="table table-hover w-100 align-middle" style="width:100%">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 35%">ชื่อร้าน</th>
                                <th style="width: 20%">หมวดหมู่</th>
                                <th style="width: 20%">จังหวัด</th>
                                <th style="width: 25%">ติดต่อ</th>
                                <th>Details</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <div id="mapViewSection" style="display: none;">
                <div class="main-card p-2">
                    <div id="map"></div>
                </div>
                <div class="text-center mt-2 small text-muted">
                    <i class="fas fa-info-circle"></i> จิ้มที่กลุ่มตัวเลขเพื่อขยาย หรือจิ้มที่หมุดเพื่อดูรายละเอียด
                </div>
            </div>

            <div class="text-center mt-4 text-muted" style="font-size: 0.8rem;">
                <p>ข้อมูลจาก OpenStreetMap | อัปเดต: <span id="lastUpdate"></span></p>
            </div>
        </div>
    </div>

    <!-- External JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    
    <!-- Custom JavaScript -->
    <script src="assets/main.js"></script>
</body>
</html>

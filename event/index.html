<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin Events - Thailand</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/icon.png">
    
    <!-- Bootstrap & Libraries -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../assets/navbar.css">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <script src="../assets/navbar.js"></script>

    <!-- Hero Header -->
    <div class="hero-header">
        <div class="container text-center">
            <h1 class="fw-bold mb-2">
                <i class="fa-solid fa-bitcoin"></i> Bitcoin Events
            </h1>
            <p class="mb-0 opacity-75">กิจกรรม Bitcoin ในประเทศไทย</p>
            <div class="welb-credit">Developed by WelB</div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container main-content">
        <!-- Loading State -->
        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3 text-muted">Loading events...</p>
        </div>

        <!-- Error State -->
        <div id="error-container" class="alert alert-danger d-none" role="alert">
            <h5 class="alert-heading">
                <i class="fas fa-exclamation-triangle me-2"></i>Error
            </h5>
            <p id="error-message" class="mb-0"></p>
        </div>

        <!-- Filters -->
        <div id="filters" class="filters-section mb-4 d-none">
            <div class="row g-3">
                <div class="col-md-6">
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-search"></i>
                        </span>
                        <input type="text" class="form-control" id="search-input" placeholder="Search events...">
                    </div>
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="status-filter">
                        <option value="all">All Events</option>
                        <option value="upcoming">Upcoming</option>
                        <option value="live">Live Now</option>
                        <option value="past">Past Events</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="price-filter">
                        <option value="all">All Prices</option>
                        <option value="free">Free</option>
                        <option value="paid">Paid</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Events Count -->
        <div id="events-count" class="mb-3 d-none">
            <p class="text-muted mb-0">
                <i class="fas fa-calendar-alt me-2"></i>
                Showing <strong id="count-number">0</strong> events
            </p>
        </div>

        <!-- Events List -->
        <div id="events-list" class="row g-4">
            <!-- Will be populated by JavaScript -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="text-center py-5 d-none">
            <i class="fas fa-calendar-times fa-4x text-muted mb-3"></i>
            <h3 class="text-muted">No events found</h3>
            <p class="text-muted">Try adjusting your filters</p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer mt-5 py-4 bg-light">
        <div class="container text-center">
            <p class="text-muted mb-2">
                <i class="fa-solid fa-bitcoin text-warning me-2"></i>
                Bitcoin Events Thailand
            </p>
            <p class="text-muted small mb-0">Developed by WelB 🚀</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="assets/events.js"></script>
</body>
</html>

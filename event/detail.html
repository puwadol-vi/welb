<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Detail - Bitcoin Events Thailand</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/public/icon.png">
    
    <!-- Bootstrap & Libraries -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <!-- Loading State -->
    <div id="loading" class="loading-container">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- Error State -->
    <div id="error-container" class="error-container d-none">
        <div class="container text-center py-5">
            <h1 class="text-danger mb-3">Error</h1>
            <p id="error-message" class="text-muted mb-4"></p>
            <button onclick="window.history.back()" class="btn btn-primary">
                <i class="fas fa-arrow-left me-2"></i>Go Back
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div id="event-container" class="d-none">
        <!-- Hero Header -->
        <div class="hero-header">
            <div class="container">
                <a href="/event/" class="btn btn-link text-white">
                    <i class="fas fa-arrow-left me-2"></i>Back to Events
                </a>
            </div>
        </div>

        <div class="container main-content">
            <div class="row g-4">
                <!-- Left Column (Desktop) - 30% -->
                <div class="col-lg-4 order-lg-1 order-2">
                    <!-- Event Image -->
                    <div id="event-images" class="event-image-section mb-4">
                        <!-- Will be populated by JavaScript -->
                    </div>

                    <!-- Action Buttons -->
                    <div id="action-buttons" class="action-buttons mb-4">
                        <!-- Will be populated by JavaScript -->
                    </div>
                </div>

                <!-- Right Column - 70% -->
                <div class="col-lg-8 order-lg-2 order-1">
                    <!-- Event Header -->
                    <div id="event-header" class="event-header-section mb-4">
                        <!-- Will be populated by JavaScript -->
                    </div>

                    <!-- Organizer Card -->
                    <div id="organizer-section" class="card mb-4 d-none">
                        <div class="card-body">
                            <!-- Will be populated by JavaScript -->
                        </div>
                    </div>

                    <!-- Event Details (Date/Time) -->
                    <div id="event-details" class="card mb-4">
                        <div class="card-body">
                            <h5 class="card-title mb-3">Event Details</h5>
                            <div id="details-container"></div>
                        </div>
                    </div>

                    <!-- Location -->
                    <div id="location-section" class="card mb-4 d-none">
                        <div class="card-body">
                            <h5 class="card-title mb-3">Location</h5>
                            <div id="location-container"></div>
                        </div>
                    </div>

                    <!-- Description -->
                    <div id="description-section" class="card mb-4">
                        <div class="card-body">
                            <h5 class="card-title mb-3">About This Event</h5>
                            <div id="description-container" class="event-description"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="assets/events.js"></script>
</body>
</html>
